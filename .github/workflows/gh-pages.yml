name: Deploy test book to GitHub Pages

# 在 Linux 上用 mdbook + 本仓库插件（mdbook-plugins）构建 test 书，
# 并部署到 gh-pages 分支（GitHub Pages）。
# 触发：推送 master 或手动触发。
# 部署前提：仓库 Settings → Pages → Source 选择 "Deploy from a branch"，分支选 gh-pages。
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: true

permissions:
  contents: write # peaceiris/actions-gh-pages 推送 gh-pages 分支需要

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 编译 mdbook-plugins。默认 features 含 pre-tikz（tectonic），
      # 需要系统 C 库 dev 包（与 release.yml 的 Linux 依赖一致）。
      - name: Install C deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libpng-dev libfreetype6-dev libfontconfig1-dev \
            libgraphite2-dev libharfbuzz-dev libicu-dev

      - name: Build mdbook-plugins
        run: cargo build --release

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        # 不指定 mdbook-version：默认安装最新版

      # mdbook 通过 PATH 查找 "mdbook-plugins <subcommand>" 插件。
      # 注意：GITHUB_PATH 只对后续步骤生效，故单独一个步骤设置 PATH。
      - name: Add mdbook-plugins to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Build test book
        run: mdbook build test

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test/books
          publish_branch: gh-pages
