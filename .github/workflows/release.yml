name: Release

# 打 tag（v*）时触发：在 3 个平台编译全功能版（含 tectonic/typst）并上传预编译二进制
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Windows 下禁用 sccache（因命令行长度限制），其他平台启用
      RUSTC_WRAPPER: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '' || 'sccache' }}
      # sccache 官方推荐用法：SCCACHE_GHA_ENABLED=true 时 sccache 直连 GitHub Actions cache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # cargo 依赖缓存：注册表索引 + target 增量构建产物，跨 tag 复用
      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── vcpkg 相关（仅 Windows） ──
      # 获取预装 vcpkg 的 commit，用于 binary cache 键
      - name: Get vcpkg commit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $commit = git -C C:\vcpkg rev-parse HEAD
          echo "VCPKG_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup vcpkg binary cache
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          vcpkgDirectory: 'C:\vcpkg'
          doNotUpdateVcpkg: true
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # sccache：安装（Windows 虽不用，但步骤无害，保留以简化逻辑）
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # ── 系统库依赖 ──
      - name: Install C deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libpng-dev libfreetype6-dev libfontconfig1-dev \
            libgraphite2-dev libharfbuzz-dev libicu-dev

      - name: Install C deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libpng freetype fontconfig graphite2 harfbuzz icu4c
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install C deps (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libpng:x64-windows-static-md freetype:x64-windows-static-md fontconfig:x64-windows-static-md graphite2:x64-windows-static-md harfbuzz:x64-windows-static-md icu:x64-windows-static-md
          "TECTONIC_DEP_BACKEND=vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── 构建（Windows 下 RUSTC_WRAPPER 为空，直接调用 rustc） ──
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # ── 打包 ──
      - name: Package (Windows, 单 exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/mdbook-plugins.exe dist/
          Compress-Archive -Path dist\* -DestinationPath mdbook-plugins-${{ matrix.target }}.zip -Force

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          tar -C target/${{ matrix.target }}/release -czf mdbook-plugins-${{ matrix.target }}.tar.gz mdbook-plugins

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mdbook-plugins-*.tar.gz
            mdbook-plugins-*.zip
          generate_release_notes: true