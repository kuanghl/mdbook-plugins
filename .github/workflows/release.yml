name: Release

# 打 tag（v*）时触发：在 3 个平台编译全功能版（含 tectonic/typst）并上传预编译二进制
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # sccache 官方推荐用法：SCCACHE_GHA_ENABLED=true 时 sccache 直连 GitHub Actions
      # cache 服务（sccache-action 已导出所需 token），无需手写 actions/cache step
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # cargo 依赖缓存：注册表索引 + target 增量构建产物，跨 tag 复用
      # （key 自动含 Cargo.lock hash、rustc 版本与 runner OS，此处追加 target 区分）
      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── vcpkg 相关（仅 Windows） ──
      # 由于 GitHub Windows runner 预装 vcpkg 在 C:\vcpkg，我们需要用 lukka/run-vcpkg
      # 配置 binary cache，但该 action 需要知道 vcpkg 的 baseline commit。
      # 此处先获取当前预装 vcpkg 的 commit，再传给 run-vcpkg，避免报错：
      # "A Git commit id for vcpkg's baseline was not found"
      - name: Get vcpkg commit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $commit = git -C C:\vcpkg rev-parse HEAD
          echo "VCPKG_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup vcpkg binary cache
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          # 安装由后续 "Install C deps (Windows)" 步骤负责，这里只配置 binary cache
          runVcpkgInstall: false
          vcpkgDirectory: 'C:\vcpkg'
          doNotUpdateVcpkg: true
          # 显式传递 vcpkg 的 commit，以便 binary cache 生成正确的 key
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # sccache：通过 SCCACHE_GHA_ENABLED 直连 GHA cache 服务，跨 tag 复用编译产物
      # （编译产物按内容 hash 判重，依赖不变时命中）
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # ── 系统库依赖（tectonic → pre-tikz 需要 pkg-config/vcpkg 找到 C 库） ──

      - name: Install C deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libpng-dev libfreetype6-dev libfontconfig1-dev \
            libgraphite2-dev libharfbuzz-dev libicu-dev

      - name: Install C deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libpng freetype fontconfig graphite2 harfbuzz icu4c
          # icu4c 是 keg-only，需手动把 pkg-config 路径加上
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install C deps (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: |
          # GitHub windows runner 预装 vcpkg（C:\vcpkg，已在 PATH）；
          # 统一 :x64-windows-static-md（静态链接），产物为单个 exe、无 dll 依赖。
          # VCPKG_ROOT 已由 run-vcpkg 导出，无需重复设置。
          vcpkg install libpng:x64-windows-static-md freetype:x64-windows-static-md fontconfig:x64-windows-static-md graphite2:x64-windows-static-md harfbuzz:x64-windows-static-md icu:x64-windows-static-md
          "TECTONIC_DEP_BACKEND=vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── 构建（Windows 禁用 sccache 以避免命令行长度限制） ──
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # Windows 下 sccache 转发参数时可能超出 CreateProcess 长度限制，
          # 此处覆盖为 ''，直接调用 rustc（rustc 内部使用响应文件，可避免此问题）。
          RUSTC_WRAPPER: ${{ runner.os == 'Windows' && '' || 'sccache' }}

      # ── 打包（命名需兼容 cargo-binstall：<name>-<target>.<ext>） ──

      - name: Package (Windows, 单 exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/mdbook-plugins.exe dist/
          Compress-Archive -Path dist\* -DestinationPath mdbook-plugins-${{ matrix.target }}.zip -Force

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          tar -C target/${{ matrix.target }}/release -czf mdbook-plugins-${{ matrix.target }}.tar.gz mdbook-plugins

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mdbook-plugins-*.tar.gz
            mdbook-plugins-*.zip
          generate_release_notes: true