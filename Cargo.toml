[package]
name = "mdbook-plugins"
version = "0.1.0"
edition = "2021"
description = "A single binary bundling 20 mdbook plugins (preprocessors and renderers), dispatched via command routing."
authors = ["mdbook-plugins"]
license = "MIT"
repository = "https://github.com/kuanghl/mdbook-plugins"
readme = "README.md"
keywords = ["mdbook", "plugin", "preprocessor", "renderer", "documentation"]
categories = ["development-tools", "text-processing"]

# 仅打包运行所需文件（crates.io 限制 .crate ≤ 10 MiB，
# test/、docs/ 等约 36 MB 的测试数据与文档不进入发布包）
include = [
    "src/**",
    "build.rs",
    "vendor/**",
    "assets/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
]

[[bin]]
name = "mdbook-plugins"
path = "src/main.rs"

[lib]
name = "mdbook_plugins"
path = "src/lib.rs"

[dependencies]
# Core mdbook 生态
mdbook-core = "0.5"
mdbook-preprocessor = "0.5"
mdbook-renderer = "0.5"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
semver = "1"
log = "0.4"
once_cell = "1"
env_logger = "0.11"

# 通用工具
toml = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

# SVG 渲染 (svgbob)
svgbob = "0.7"

# HTTP/异步 (kroki, linkcheck)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking"] }
base64 = "0.22"
flate2 = "1"
tar = "0.4"

# KaTeX — 纯 Rust 实现，无需 Node.js
katex-rs = "0.2.4"
rayon = "1"

# TeX → PDF 编译（tectonic 引擎）
tectonic = { version = "0.16", optional = true }

sha2 = "0.10"

# PDF → SVG 转换（hayro-svg）
hayro-svg = { version = "0.7", optional = true }
hayro-syntax = { version = "0.7", optional = true }
hayro-interpret = { version = "0.7", optional = true }
kurbo = "0.13"

# C 依赖 (pikchr)
libc = "0.2"

# Typst — 纯 Rust 排版引擎
typst = { version = "0.15", optional = true }
typst-svg = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-assets = { version = "0.15", optional = true }
typst-kit = { version = "0.15", features = ["scan-fonts", "embedded-fonts"], optional = true }

# URL
url = "2"

# AsciiDoc 渲染

# Office 渲染
office_oxide = { version = "0.1", optional = true }
chromiumoxide = { version = "0.9.1", optional = true }
chromiumoxide_cdp = { version = "0.9.1", optional = true }

# 轻量 CDP 客户端（替代 chromiumoxide）
tokio-tungstenite = "0.24"

# HTML DOM 解析（PDF HTML 预处理）
scraper = "0.22"

# PDF 后处理（大纲/书签 + 元数据）
lopdf = "0.34"
indexmap = "2"
tempfile = "3"
emojis = "0.9.0"


# 特性开关
[features]
default = ["all"]
all = [
    "pre-alerts", "pre-emojicodes", "pre-toc", "pre-echarts",
    "pre-langtabs", "pre-mermaid", "pre-katex", "pre-admonish",
    "pre-svgbob", "pre-pikchr", "pre-kroki", "pre-embedify",
    "pre-image-viewer",
    "pre-wavedrom",
    "pre-pdfviewer",
    "pre-tikz", "pre-typst",
    "ren-asciidoc", "ren-linkcheck", "ren-pdf",
]
pre-alerts = []
pre-emojicodes = []
pre-toc = []
pre-echarts = []
pre-langtabs = []
pre-mermaid = []
pre-pdfviewer = []
pre-katex = []
pre-admonish = []
pre-svgbob = []
pre-pikchr = []
pre-kroki = []
pre-embedify = []
pre-image-viewer = []
pre-wavedrom = []
pre-tikz = ["dep:tectonic", "dep:hayro-svg", "dep:hayro-syntax", "dep:hayro-interpret"]
pre-typst = ["dep:typst", "dep:typst-svg", "dep:typst-pdf", "dep:typst-layout", "dep:typst-assets", "dep:typst-kit"]
pre-pdf-cdp-heavy = ["dep:chromiumoxide", "dep:chromiumoxide_cdp"]
ren-asciidoc = []
ren-linkcheck = []
ren-office = ["dep:office_oxide"]
ren-pdf = []

[build-dependencies]
cc = "1"

[profile.release]
# 以体积为优先优化目标
opt-level = "z"
# 剥离符号
strip = true
# 跨 crate 链接时优化，消除内联重复
lto = "fat"
# 单代码生成单元，最大化内联机会
codegen-units = 1
# 无需 unwinding（CLI 插件，无 catch_unwind），直接 abort 可节省大量体积
panic = "abort"
