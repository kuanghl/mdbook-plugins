[book]
authors = ["khl <1365342449@qq.com>"]
title = "mdbook-plugins"
description = "The example book covers examples."
language = 'zh' # "zh-Hans" # "en"
src = "./src"

[build]
build-dir = "books"
create-missing = true
use-default-preprocessors = false
# extra-watch-dirs = ["po"]

[preprocessor.index]

[preprocessor.links]

[preprocessor.alerts]
command = "mdbook-plugins alerts"

[preprocessor.image-viewer]
command = "mdbook-plugins image-viewer"

[preprocessor.emojicodes]
command = "mdbook-plugins emojicodes"
renderers = ["html"]

# devicons cdn慢卡顿
# [preprocessor.langtabs]
# command = "mdbook-plugins langtabs"

# catppuccin 是 CSS 主题项目（非 Rust），未合并到 mdbook-plugins
# [preprocessor.catppuccin]
# assets_version = "2.1.0" # DO NOT EDIT: Managed by `mdbook-catppuccin install`

[preprocessor.toc]
command = "mdbook-plugins toc"
renderers = ["html"]

[preprocessor.katex]
command = "mdbook-plugins katex"
renderers = ["html"]
after = ["links"]
no-css = true
include-src = true

# gettext 未合并到 mdbook-plugins，需单独安装 mdbook-i18n-helpers
# [preprocessor.gettext]
# after = ["toc"]

[preprocessor.admonish]
command = "mdbook-plugins admonish"
renderers = ["html"]
assets_version = "3.0.1" # do not edit: managed by `mdbook-admonish install`

[preprocessor.mermaid]
command = "mdbook-plugins mermaid"
renderers = ["html"]

# kroki 图（```kroki-xxx）：内容 hash 缓存已内置——首次请求网络，后续未变化的图
# 直接复用本地 SVG，serve 反复重建不再卡顿
# [preprocessor.kroki-preprocessor]
# command = "mdbook-plugins kroki-preprocessor"
# renderers = ["html"]
# Example endpoint configuration
# endpoint = "https://kroki.io"      # serve
# endpoint = "http://localhost:8000" # local docker

# 有些动态的或者函数式的图在pdf会留空
# 切换章节加载网页有延迟
[preprocessor.echarts]
command = "mdbook-plugins echarts"
after = ["katex"]

[preprocessor.pdf-preview]
command = "mdbook-plugins pdf-preview"
renderers = ["html"]

[preprocessor.pikchr]
command = "mdbook-plugins pikchr"
renderers = ["html"]

# wavedrom 由 mdbook-echarts 统一处理
# [preprocessor.wavedrom-rs]
# command = "mdbook-plugins wavedrom-rs"

[output.html]
mathjax-support = true
hash-files = false
default-theme = "Light"
preferred-dark-theme = "mocha"
git-repository-url = "https://github.com/kuanghl/mdbook-plugins"
git-repository-icon = "fab-github"
no-section-label = true
edit-url-template = "https://github.com/kuanghl/mdbook-plugins/edit/master/{path}"
additional-css = [
    "./theme/mdbook-admonish.css", 
    "./theme/catppuccin.css", "./theme/catppuccin-admonish.css", 
    "./assets/mermaid/mermaid.css",
    "./assets/whichlang/whichlang.css",
    "./assets/translate/translate.css",       # 翻译加载网页变慢
    # "./assets/langtabs/langtabs.css",
    ]
additional-js = [
    "./assets/help/support.js", 
    "./assets/mermaid/mermaid.min.js", "./assets/mermaid/mermaid-init.js",
    "./assets/whichlang/whichlang.js", 
    "./assets/translate/translate_button.js",  # 翻译加载网页变慢
    "./assets/echarts/echarts.min.js", 
    "./assets/bytefield/bytefield-svg.js",
    "./assets/wavedrom/wavedrom.min.js",
    "./assets/wavedrom/wavedrom.css.js",
    "./assets/pdfviewer/pdf-preview.js",
    # "./assets/langtabs/langtabs.js", 
    ]

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

# 中文搜索索引构建（自动在 HTML 渲染后运行，zz- 确保排在 html 之后）
[output.zz-build-search]
command = "mdbook-plugins build-search"

# pdf 预览的 pdfjs 模式本地资源：在 html 渲染后复制 pdf.js 到输出目录（不污染 src/）。
# 仅当 [preprocessor.pdf-preview] mode = "pdfjs" 时需要；embed 模式（默认）不需要。
[output.pdf-preview-assets]
command = "mdbook-plugins pdf-preview-assets"

[output.html.fold]
enable = true # false
level = 0 # 1

[output.html.playground]
editable = true

[output.html.print]
enable = true

